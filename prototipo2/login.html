<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Proyecta</title>
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <h1 class="logo">Proyecta</h1>
    <a href="home.html" class="home-icon">
      <img src="img/casa.jpg" alt="Home" class="home-img">
    </a>
  </header>

  <!-- MAIN -->
  <main class="login-container">
    <!-- Lado izquierdo (formulario) -->
    <div class="login-box">
      <img src="img/icono.jpg" alt="Usuario" class="profile-img">

      <form id="loginForm">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario">
        <span class="error-msg" id="userError"></span>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
        <span class="error-msg" id="passError"></span>

        <div class="show-password">
          <input type="checkbox" id="showPassword">
          <label for="showPassword">Mostrar contraseña</label>
        </div>

        <div class="remember">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">Recuérdame</label>
        </div>

        <button type="submit" class="login-btn" id="submit">Iniciar Sesión</button>
      </form>
    </div>

    <!-- Lado derecho (imagen) -->
    <div class="login-image">
      <img src="img/login.jpg" alt="Decoración lateral">
    </div>
  </main>

  <script src="./js/login.js"></script>
</body>
</html>
